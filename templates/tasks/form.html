{% extends 'base.html' %}
{% block title %}{{ heading }} - MendMate{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>{{ heading }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'form_fields.html' %}
    <button type="submit" class="btn">{{ submit_label }}</button>
    <a class="btn btn-outline" href="{% if task %}{% url 'task_detail' task.pk %}{% else %}{% url 'task_list' %}{% endif %}">Cancel</a>
  </form>
</div>
{% endblock %}
