{% extends 'base.html' %}
{% block title %}Delete task - MendMate{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Delete this task?</h2>
  <p><strong>{{ task.title }}</strong> ({{ task.get_status_display }}) will be permanently removed. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-outline" href="{% url 'task_detail' task.pk %}">No, go back</a>
  </form>
</div>
{% endblock %}
